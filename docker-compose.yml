# One command: MongoDB + the app (API and built pages) on http://localhost:4000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    env_file: [./backend/.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/halyk_pay
      PUBLIC_API_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:4000
    ports:
      - "4000:4000"
      - "4100:4100" # built-in Halyk simulator (only used when HALYK_ENV=mock)
volumes:
  mongo_data:
